
<html >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prodigy Task 01 - Interactive Nav</title>
    <style>
        /* --- CSS STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            line-height: 1.6;
        }

       
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 10%;
            background-color: transparent; /* Start transparent */
            transition: all 0.4s ease;
            z-index: 1000;
        }

        
        nav.scrolled {
            background-color: #1a2a6c; /* Dark Blue */
            padding: 15px 10%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            transition: 0.4s;
        }

        nav.scrolled .logo {
            color: #ffffff;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            font-size: 18px;
            transition: 0.3s;
            padding: 8px 15px;
            border-radius: 4px;
        }

        
        nav.scrolled ul li a {
            color: #ffffff;
        }

        
        nav ul li a:hover {
            color: #ffffff !important;
            background-color: #f06292; /* Pinkish-Coral highlight */
            transform: translateY(-2px);
        }

        
        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(255,255,255,0.7), rgba(255,255,255,0.7)), 
                        url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            text-align: center;
        }

        .content-section {
            height: 800px;
            padding: 100px 10%;
            text-align: center;
        }
    </style>
</head>
<body>

    <nav id="navbar">
        <div class="logo">PRODIGY WD</div>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <section id="home" class="hero">
        <div>
            <h1 style="font-size: 3.5rem;">Interactive Navigation</h1>
            <p style="font-size: 1.2rem;">Scroll down to see the navbar change style!</p>
        </div>
    </section>

    <section id="about" class="content-section">
        <h2>About This Task</h2>
        <p>This project demonstrates the use of <strong>Event Listeners</strong> in JavaScript to manipulate the <strong>DOM</strong> based on user scroll behavior.</p>
    </section>

    <script>
        window.onscroll = function() {
            const navbar = document.getElementById('navbar');
            
            // Check if user has scrolled more than 80 pixels
            if (window.scrollY > 80) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        };
    </script>

</body>
</html>
